name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ copilot/build-apk ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        working-directory: hard-thoughts-app
        run: npm install

      - name: Build web
        working-directory: hard-thoughts-app
        run: npm run build

      - name: Capacitor init (first time only)
        working-directory: hard-thoughts-app
        run: |
          npx cap init HardThoughts com.hardthoughts.app --web-dir=dist || true
          npx cap add android || true

      - name: Sync Android
        working-directory: hard-thoughts-app
        run: npx cap sync android

      - name: Build APK
        working-directory: hard-thoughts-app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hard-thoughts-debug-apk
          path: hard-thoughts-app/android/app/build/outputs/apk/debug/app-debug.apk
