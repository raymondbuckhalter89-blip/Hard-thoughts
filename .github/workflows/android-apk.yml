name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/build-it-feature

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract and navigate to app directory
        run: |
          unzip hard-thoughts-app-fullstack.zip
          cd hard-thoughts-app

      - name: Install dependencies
        working-directory: hard-thoughts-app
        run: npm ci

      - name: Install Tailwind CSS
        working-directory: hard-thoughts-app
        run: npm install -D tailwindcss@3 postcss autoprefixer

      - name: Build web
        working-directory: hard-thoughts-app
        run: npm run build

      - name: Install Capacitor Android
        working-directory: hard-thoughts-app
        run: npm install @capacitor/android@^6.1.2

      - name: Capacitor init
        working-directory: hard-thoughts-app
        run: |
          npx cap init HardThoughts com.hardthoughts.app --web-dir=dist || true
          npx cap add android || true

      - name: Sync Android
        working-directory: hard-thoughts-app
        run: npx cap sync android

      - name: Build APK
        working-directory: hard-thoughts-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hard-thoughts-debug-apk
          path: hard-thoughts-app/android/app/build/outputs/apk/debug/app-debug.apk
