name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/build-it-feature

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: hard-thoughts-app
        run: npm ci

      - name: Build web
        working-directory: hard-thoughts-app
        run: npm run build

      - name: Sync Android
        working-directory: hard-thoughts-app
        run: npx cap sync android

      - name: Build APK
        working-directory: hard-thoughts-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hard-thoughts-debug-apk
          path: hard-thoughts-app/android/app/build/outputs/apk/debug/app-debug.apk
